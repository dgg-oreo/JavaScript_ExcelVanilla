<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de calculo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./src/style/vanilla.css">

</head>
<body>

<div class="app-shell">


  <header class="menu-bar">
    <div class="menu-spacer" role="presentation"></div>
    <div class="menu-actions">
      <button class="btn btn-primary" type="button">Guardar</button>
    </div>
  </header>



  <div class="formula-bar">
    <div class="name-box" title="Referencia de celda">E2</div>
  </div>



  <div class="main-area">

    <aside class="tool-strip" aria-label="Herramientas"></aside>

    <section class="sheet-viewport" aria-label="Cuadricula de la hoja">
      <div class="sheet-scroll">
      </div>
    </section>


    <aside class="dock-panel" aria-label="Paneles laterales">
      <section class="dock">
        <header class="dock-header">
          <span>Funciones</span>
        </header>
        <div class="dock-body">
          <div class="fn-grid">
            <button class="fn-chip" type="button">SUMA()</button>
            <button class="fn-chip" type="button">PROMEDIO()</button>
            <button class="fn-chip" type="button">MAX()</button>
            <button class="fn-chip" type="button">MIN()</button>
          </div>
          <div class="op-row">
            <button class="op-chip" type="button">+</button>
            <button class="op-chip" type="button">−</button>
            <button class="op-chip" type="button">×</button>
            <button class="op-chip" type="button">÷</button>
            <button class="op-chip" type="button">( )</button>
          </div>
        </div>
      </section>

      <section class="dock">
        <header class="dock-header">
          <span>Formato de celda</span>

        </header>
        <div class="dock-body">
          <label class="field">
            <span class="field-label">Tipo</span>
            <select class="field-select">
              <option>General</option>
              <option>Moneda (Q)</option>
              <option>Porcentaje</option>
              <option>Numero</option>
            </select>
          </label>
        </div>
      </section>

    </aside>
  </div>

  <footer class="status-bar">
  </footer>

<script src="./src/js/grid.js"></script>
<script src="./src/js/index.js"></script>
<script src="./src/js/model.js"></script>


</div>
</body>
</html>
